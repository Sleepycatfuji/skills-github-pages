      const DATA_SHA256 = "0aa87108be852ccbf63bb043d2e0192ed34c07047c2c6c79ccd31e63a5d67713"; // Set by build_release.py for production bundles.

          navSearch: "Home",
          navHowToUse: "How to Use",

          copyReference: "Copy hymn reference",
          copySuccess: "Copied!",
          copyFailure: "Could not copy. Please try again in a browser with clipboard access.",
          copySelectChorale: "Choose a chorale-book version before copying.",
          copyNoChorale: "This hymn has no chorale number to copy. A book page is not a chorale number.",
          copyMissingInformation: "The hymn reference is missing its title or verse count and cannot be copied.",
        },
      };

      function t(key, ...args) {
        const value = translations[currentLanguage][key];
        return typeof value === "function" ? value(...args) : value;
      }

      function applyLanguage() {
        document.documentElement.lang = currentLanguage;
        document.title = t("appTitle");
        document.getElementById("appTitle").textContent = t("appTitle");
        document.getElementById("searchLabel").textContent = t("searchLabel");
        document.getElementById("searchInput").placeholder = t("searchPlaceholder");
        document.getElementById("searchButton").setAttribute("aria-label", t("searchButton"));
        document.getElementById("clearButton").setAttribute("aria-label", currentLanguage === "da" ? "Ryd søgning" : "Clear search");
        for (const id of ["navSearch", "navHowToUse", "navAbout", "navChangelog", "navContact"]) {
          document.getElementById(id).querySelector("[data-nav-label]").textContent = t(id);
        }
        document.getElementById("mainNavigation").setAttribute("aria-label", t("navigationLabel"));
        document.querySelector(".toolbar-group").setAttribute("aria-label", currentLanguage === "da" ? "Sprog" : "Language");
        document.getElementById("skipLink").textContent = currentLanguage === "da" ? "Spring til indhold" : "Skip to content";
        document.getElementById("results").setAttribute("aria-label", currentLanguage === "da" ? "Søgeresultater" : "Search results");
        document.getElementById("langDaButton").setAttribute("aria-pressed", String(currentLanguage === "da"));
        document.getElementById("langEnButton").setAttribute("aria-pressed", String(currentLanguage === "en"));
        const status = document.getElementById("status");
        if (status.dataset.state === "loading") status.textContent = t("loading");
        if (status.dataset.state === "error") status.textContent = t("couldNotLoad");
      }

      function loadStoredObject(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || "{}");
        } catch (error) {
          console.error(`Could not load ${key}:`, error);
          return {};
        }
      }

      function saveStoredObject(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function loadPreferences() {
        return loadStoredObject(PREFERENCES_KEY);
      }

      function savePreferences(preferences) {
        saveStoredObject(PREFERENCES_KEY, preferences);
      }

      function setPreferredChorale(hymnNumber, optionId) {
        const preferences = loadPreferences();
        preferences[String(hymnNumber)] = optionId;
        savePreferences(preferences);
      }

      function clearPreferredChorale(hymnNumber) {
        const key = String(hymnNumber);

        const preferences = loadPreferences();
        delete preferences[key];
        savePreferences(preferences);

        const legacyPreferences = loadStoredObject(LEGACY_PREFERENCES_KEY);
        delete legacyPreferences[key];
        saveStoredObject(LEGACY_PREFERENCES_KEY, legacyPreferences);
      }

      function getPreferredChorale(hymnNumber, choraleOptions) {
        const hymnKey = String(hymnNumber);
        const savedOptionId = loadPreferences()[hymnKey];

        if (
          savedOptionId &&
          choraleOptions.some((option) => option.option_id === savedOptionId)
        ) {
          return savedOptionId;
        }

        // One-time compatibility migration for preferences saved by the
        // previous version of the app, which stored a recording label.
        const legacyValue = loadStoredObject(LEGACY_PREFERENCES_KEY)[hymnKey];
        if (!legacyValue) {
          return null;
        }

        const matchingOptions = choraleOptions.filter(
          (option) => option.recording_melody === legacyValue,
        );

        if (matchingOptions.length === 1) {
          const migratedOptionId = matchingOptions[0].option_id;
          setPreferredChorale(hymnNumber, migratedOptionId);
          return migratedOptionId;
        }

        return null;
      }

      function loadComments() {
        return loadStoredObject(COMMENTS_KEY);
      }

      function saveComments(comments) {
        saveStoredObject(COMMENTS_KEY, comments);
      }

      function getComment(hymnNumber) {
        const comments = loadComments();
        return comments[String(hymnNumber)] || "";
      }

      function setComment(hymnNumber, commentText) {
        const comments = loadComments();
        comments[String(hymnNumber)] = commentText;
        saveComments(comments);
      }

      function normalizeText(text) {
        return String(text || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getChoraleOptions(hymn) {
        const structuredOptions = Array.isArray(hymn.chorale_options)
          ? hymn.chorale_options
          : [];

        if (structuredOptions.length > 0) {
          return structuredOptions.map((option, index) => {
            const displayKds =
              option.display_kds ||
              (Array.isArray(option.kds_codes)
                ? option.kds_codes.join(", ")
                : "") ||
              option.chorale_number ||
              "?";

            return {
              option_id: String(
                option.option_id || `kds:${displayKds}:${index}`,
              ),
              display_kds: String(displayKds),
              chorale_title: option.chorale_title || "",
              recording_melody: option.recording_melody || null,
              source_melody: option.source_melody || null,
            };
          });
        }

        // Backward-compatible fallback while older JSON is still deployed.
        return (hymn.chorales || []).map((chorale, index) => ({
          option_id: `legacy:${hymn.hymn_number}:${chorale.chorale_number || index}`,
          display_kds: String(chorale.chorale_number || "?"),
          chorale_title: chorale.chorale_title || "",
          recording_melody: null,
          source_melody: null,
        }));
      }

      function getCopyReference(hymn, selectedOptionId = null) {
        // Copy only actual chorales in the dataset, never book_page or a
        // formatted display label. Each selectable version is one KDS code.
        const choraleNumbers = new Set(
          (hymn.chorales || []).map((chorale) => String(chorale.chorale_number)),
        );
        const options = getChoraleOptions(hymn).filter((option) => {
          const code = option.display_kds;
          return /^[1-9]\d{0,2}[ab]?$/.test(code) &&
            parseInt(code, 10) <= 568 && choraleNumbers.has(code);
        });
        if (options.length === 0) return { error: "copyNoChorale" };

        const selectedId = selectedOptionId ||
          getPreferredChorale(hymn.hymn_number, options);
        const option = options.length === 1 ? options[0] :
          options.find((item) => item.option_id === selectedId);
        if (!option) return { error: "copySelectChorale" };

        // The reference describes the selected tune, whose title may differ
        // from the hymn (e.g. hymn 455, chorale 288: Jesus han er syndres ven).
        // Older datasets without a tune title still have a usable hymn title.
        const title = (String(option.chorale_title || "").trim() || String(hymn.hymn_title || ""))
          .split(/\s+/)
          .map((word) => word.replace(/[^\p{L}\p{M}\p{N}]/gu, ""))
          .filter(Boolean)
          .slice(0, 3)
          .join(" ");
        if (!title || !Number.isInteger(hymn.verse_count) || hymn.verse_count <= 0) {
          return { error: "copyMissingInformation" };
        }
        return {
          text: `${option.display_kds} (${hymn.hymn_number}) ${title} ${hymn.verse_count}v`,
        };
      }

      async function copyHymnReference(hymn, card) {
        const button = card.querySelector(".copy-reference-button");
        const status = card.querySelector(".copy-status");
        if (button.disabled) return;
        clearTimeout(card.copyFeedbackTimer);
        button.classList.remove("copied");
        status.textContent = "";
        delete status.dataset.messageKey;

        const selectedId = card.querySelector('input[type="radio"]:checked')?.value;
        const reference = getCopyReference(hymn, selectedId);
        const showMessage = (key) => {
          status.dataset.messageKey = key;
          status.textContent = t(key);
        };
        if (reference.error) {
          showMessage(reference.error);
          return;
        }

        button.disabled = true;
        try {
          // An unavailable or denied Clipboard API gets clear inline feedback;
          // no deprecated copy commands or permission prompts are needed.
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
          await navigator.clipboard.writeText(reference.text);
          button.classList.add("copied");
          showMessage("copySuccess");
          card.copyFeedbackTimer = setTimeout(() => {
            button.classList.remove("copied");
            status.textContent = "";
            delete status.dataset.messageKey;
          }, 2000);
        } catch (error) {
          showMessage("copyFailure");
        } finally {
          button.disabled = false;
        }
      }

      function hymnMatchesQuery(hymnKey, hymn, query) {
        const rawQuery = String(query || "").trim();
        const q = normalizeText(rawQuery);

        if (!q) {
          return true;
        }

        const hymnNumber = String(
          hymn.hymn_number !== undefined && hymn.hymn_number !== null
            ? hymn.hymn_number
            : hymnKey,
        ).trim();

        const title = normalizeText(hymn.hymn_title || "");
        const firstLine = normalizeText(hymn.first_line || "");

        if (/^\d+$/.test(rawQuery)) {
          return hymnNumber === rawQuery;
        }

        return title.includes(q) || firstLine.includes(q);
      }

      function renderChoraleOptionsHtml(
        hymn,
        choraleOptions,
        preferredOptionId,
      ) {
        const bookReferenceHtml = Number.isInteger(hymn.book_page) && hymn.book_page > 0
          ? `<p class="special-reference" data-reference-type="book_page" data-page-number="${hymn.book_page}"><strong>${t("choraleBookPage")} ${hymn.book_page}</strong> — ${escapeHtml(hymn.book_page_label)}</p>`
          : "";
        if (choraleOptions.length === 0) {
          return bookReferenceHtml || `<p>${t("noChorales")}</p>`;
        }

        const hymnNumber = escapeHtml(hymn.hymn_number);

        return `
          <div class="chorale-options-section">
            <div class="section-title">${t("choraleOptions")}</div>
            <div class="muted section-help">${t("choraleOptionsHelp")}</div>
            <div class="chorale-options">
              ${choraleOptions
                .map((option) => {
                  const checked =
                    preferredOptionId === option.option_id ? "checked" : "";
                  const selectedClass =
                    preferredOptionId === option.option_id ? "selected" : "";
                  // Prefer the official hymn-site attribution when available.
                  // Otherwise show the source melody reference. These are intentionally
                  // displayed as one plain-language line rather than two technical fields.
                  const composerOrSource =
                    option.recording_melody || option.source_melody || null;
                  const composerSourceHtml = composerOrSource
                    ? `<div class="chorale-option-meta">
                        <strong>${t("composerSource")}:</strong>
                        ${escapeHtml(composerOrSource)}
                      </div>`
                    : "";

                  return `
                    <label class="chorale-option ${selectedClass}" data-reference-type="chorale" data-chorale-number="${escapeHtml(option.display_kds)}">
                      <input
                        type="radio"
                        name="preferred-kds-${hymnNumber}"
                        value="${escapeHtml(option.option_id)}"
                        ${checked}
                      />
                      <span class="chorale-option-content">
                        <span class="chorale-option-main">
                          <strong>${t("choraleBookNumber")} ${escapeHtml(option.display_kds)}</strong>
                          — ${escapeHtml(option.chorale_title)}
                        </span>
                        ${composerSourceHtml}
                      </span>
                    </label>
                  `;
                })
                .join("")}
            </div>
            ${bookReferenceHtml}
          </div>
        `;
      }

      function renderSharedRecordingInformationHtml(
        recordingMelodies,
        choraleOptions,
      ) {
        const recordings = Array.from(
          new Set((recordingMelodies || []).filter(Boolean)),
        );

        if (recordings.length === 0) {
          return "";
        }

        const assignedRecordings = new Set(
          choraleOptions
            .map((option) => normalizeText(option.recording_melody))
            .filter(Boolean),
        );

        // Show only labels not already displayed inside an individual KDS choice.
        const sharedRecordings = recordings.filter(
          (recording) => !assignedRecordings.has(normalizeText(recording)),
        );

        if (sharedRecordings.length === 0) {
          return "";
        }

        return `
          <div class="recording-information">
            <div class="section-title">${t("melodyInformation")}</div>
            <div class="muted section-help">${t("melodyInformationHelp")}</div>
            <ul class="recording-list">
              ${sharedRecordings
                .map((recording) => `<li>${escapeHtml(recording)}</li>`)
                .join("")}
            </ul>
          </div>
        `;
      }

      function renderResults(matches) {
        const results = document.getElementById("results");
        const status = document.getElementById("status");
        results.innerHTML = "";

        if (matches.length === 0) {
          status.textContent = t("noResults");
          return;
        }

        status.textContent = t("resultsFound", matches.length);

        matches.forEach((hymn) => {
          const card = document.createElement("div");
          card.className = "card hymn-card";

          const choraleOptions = getChoraleOptions(hymn);
          const preferredOptionId = getPreferredChorale(
            hymn.hymn_number,
            choraleOptions,
          );
          const savedComment = getComment(hymn.hymn_number);
          const recordingMelodies = hymn.recording_melodies || [];

          const verseCountText =
            hymn.verse_count !== undefined && hymn.verse_count !== null
              ? hymn.verse_count
              : t("unknownVerseCount");

          const sourceMelodiesText =
            (hymn.melodies || []).map(escapeHtml).join(" | ") || "-";

          const showClearPreference = Boolean(preferredOptionId);

          card.innerHTML = `
            <button class="copy-reference-button" type="button"
              title="${t("copyReference")}" aria-label="${t("copyReference")}"
              aria-describedby="copy-status-${escapeHtml(hymn.hymn_number)}">
              <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="8" y="8" width="12" height="13" rx="2" />
                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3" />
              </svg>
              <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m5 12 4 4L19 6" />
              </svg>
            </button>
            <h2 class="hymn-heading">
              <strong><span class="hymn-number">${t("hymnLabel")} ${escapeHtml(hymn.hymn_number)}</span> <span class="hymn-title">${escapeHtml(hymn.hymn_title)}</span></strong>
              ${
                showClearPreference
                  ? `<span class="badge">${t("preferredSaved")}</span>`
                  : ""
              }
            </h2>
            <div id="copy-status-${escapeHtml(hymn.hymn_number)}" class="copy-status"
              role="status" aria-live="polite" aria-atomic="true"></div>

            <p class="muted">${t("verseCount")}: ${escapeHtml(verseCountText)}</p>

            <p class="muted">
              ${t("sourceMelodies")}: ${sourceMelodiesText}
            </p>

            ${renderChoraleOptionsHtml(hymn, choraleOptions, preferredOptionId)}

            ${renderSharedRecordingInformationHtml(
              recordingMelodies,
              choraleOptions,
            )}

            ${
              showClearPreference
                ? `<button
                    class="secondary-button clear-preference-button"
                    data-hymn-number="${escapeHtml(hymn.hymn_number)}"
                    type="button">
                    ${t("clearPreference")}
                  </button>`
                : ""
            }

            <div class="comment-box">
              <label for="comment-${escapeHtml(hymn.hymn_number)}">
                <strong>${t("notesLabel")}</strong>
              </label>
              <textarea
                id="comment-${escapeHtml(hymn.hymn_number)}"
                placeholder="${t("notesPlaceholder")}"
              >${escapeHtml(savedComment)}</textarea>

              <button
                class="save-comment-button"
                data-hymn-number="${escapeHtml(hymn.hymn_number)}"
                type="button">
                ${t("saveComment")}
              </button>

              <div
                id="comment-status-${escapeHtml(hymn.hymn_number)}"
                class="comment-status"
              ></div>
            </div>
          `;

          card.querySelector(".copy-reference-button").addEventListener("click", () => {
            copyHymnReference(hymn, card);
          });

          card
            .querySelectorAll(`input[name="preferred-kds-${hymn.hymn_number}"]`)
            .forEach((radio) => {
              radio.addEventListener("change", (event) => {
                setPreferredChorale(hymn.hymn_number, event.target.value);
                runSearch(activeQuery);
              });
            });

          const clearPreferenceButton = card.querySelector(
            ".clear-preference-button",
          );
          if (clearPreferenceButton) {
            clearPreferenceButton.addEventListener("click", () => {
              clearPreferredChorale(hymn.hymn_number);
              runSearch(activeQuery);
            });
          }

          const saveCommentButton = card.querySelector(".save-comment-button");
          saveCommentButton.addEventListener("click", () => {
            const hymnNumber = saveCommentButton.dataset.hymnNumber;
            const textarea = card.querySelector(`#comment-${hymnNumber}`);
            const statusEl = card.querySelector(
              `#comment-status-${hymnNumber}`,
            );
            setComment(hymnNumber, textarea.value);
            statusEl.textContent = t("commentSaved");
            setTimeout(() => {
              statusEl.textContent = "";
            }, 2000);
          });

          results.appendChild(card);
        });
      }

      function runSearch(query = document.getElementById("searchInput").value) {
        activeQuery = String(query).trim();
        const status = document.getElementById("status");
        const results = document.getElementById("results");
        document.getElementById("clearButton").hidden = !document.getElementById("searchInput").value;
        if (status.dataset.state !== "loaded") return;
        if (!activeQuery) {
          results.innerHTML = "";
          status.textContent = "";
          status.hidden = true;
          return;
        }
        status.hidden = false;

        const matches = Object.entries(hymnData)
          .filter(([hymnKey, hymn]) => hymnMatchesQuery(hymnKey, hymn, activeQuery))
          .map(([hymnKey, hymn]) => {
            if (hymn.hymn_number === undefined || hymn.hymn_number === null) {
              return { ...hymn, hymn_number: Number(hymnKey) || hymnKey };
            }
            return hymn;
          });

        matches.sort((a, b) => Number(a.hymn_number) - Number(b.hymn_number));
        renderResults(matches);
      }

      async function loadData() {
        const status = document.getElementById("status");
        status.dataset.state = "loading";

        try {
          const response = await fetch(DATA_PATH);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const payload = await response.text();
          if (DATA_SHA256) {
            const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(payload));
            const actual = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
            if (actual !== DATA_SHA256) throw new Error("Dataset does not match this frontend release");
          }
          hymnData = JSON.parse(payload);

          status.dataset.state = "loaded";
          runSearch(activeQuery);
        } catch (error) {
          console.error(error);
          status.dataset.state = "error";
          status.hidden = false;
          status.textContent = t("couldNotLoad");
        }
      }

      document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        runSearch();
      });

      document.getElementById("clearButton").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        runSearch();
        document.getElementById("searchInput").focus();
      });

      document.getElementById("searchInput").addEventListener("input", () => {
        const input = document.getElementById("searchInput");
        document.getElementById("clearButton").hidden = !input.value;
        if (!input.value.trim()) runSearch("");
      });

      document.getElementById("langDaButton").addEventListener("click", () => {
        currentLanguage = "da";
        localStorage.setItem(LANGUAGE_KEY, currentLanguage);
        applyLanguage();
        runSearch(activeQuery);
      });

      document.getElementById("langEnButton").addEventListener("click", () => {
        currentLanguage = "en";
        localStorage.setItem(LANGUAGE_KEY, currentLanguage);
        applyLanguage();
        runSearch(activeQuery);
      });

      applyLanguage();
      loadData();
    </script>
  </body>
</html>
